name: Update Fund List

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetchFunds.js
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/funds.json
          git commit -m "Auto-update fund list" || echo "No changes"
          git push
