name: Update Fund List

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetchFunds.js

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install amfipy
      - run: python scripts/fetch_ratios.py

      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/funds.json data/amc_list.json data/ter_raw.json
          git commit -m "Auto-update fund list + ratios" || echo "No changes"
          git push